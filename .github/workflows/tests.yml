# AgentBus — a tesztkészlet EGY HARMADIK GÉPEN
#
# MIÉRT: a Matesensei-oldal minden mérési jegyzőkönyve kimondja, hogy „a repóban nincs CI; minden itteni szám a
# MI gépünkön mért szám" — és ugyanez igaz ránk. Ez a job nem azért van, mert a GitHub runner megbízhatóbb
# nálunk, hanem mert HARMADIK gép: a számot egyik fél gépe sem állítja elő egyedül.
#
# ELVEK (a capsule2-spec sds-conformance.yml mintájára):
#   * NINCS harmadik féltől származó action (se checkout, se setup-python) — a klónozás sima `git`, a Python a
#     runner-image rendszer-Pythonja. Kevesebb bizalmi felület, nincs mit tag-re pinelni.
#   * A telepítés FAIL-CLOSED, hash-lockolt closure-ból (`--require-hashes --no-deps`), tehát egy megcserélt
#     vagy elsodort függőség nem kerülhet be.
#   * A hitelesítő fejléc maszkolva, a futás után a `.git/config`-ot ellenőrizzük, hogy NEM őrzött meg titkot.
#
# KIMONDOTT KORLÁT: ez a workflow-fájl a HEAD-en él, tehát egy PR ki tudja kapcsolni magát. Ezt a repó
# beállításai zárják (required status check, ami a HIÁNYZÓ checket is pirosnak veszi) — tulajdonosi döntés,
# nem kódkérdés. A `requirements-ci.txt` sem tudja pinelni önmagát.
name: agentbus-tests
on:
  pull_request:
  push:
    branches: [ main, dev/v1.5-notary ]
  workflow_dispatch:
permissions:
  contents: read
env:
  # A SZÁNDÉKOSAN NYITOTT szondák: ezek nem hiba, hanem kimondott korlátok. A gate nem rejti el őket —
  # külön lépésben lefutnak és a kimenetük a logban van, csak nem döntik be a zöldet.
  KNOWN_OPEN: >-
    --deselect test_joint_delivery_outcome.py::ClampLiedFields::test_lied_next_id_must_not_defeat_the_clamp
    --deselect test_joint_delivery_outcome.py::ClampLiedFields::test_lied_pending_must_not_defeat_the_clamp
    --deselect test_joint_audit_anchor_20260916.py::AuditSliceIsUnanchored::test_chain_verify_must_anchor_the_slice_start
jobs:
  tests:
    name: "tests (REQUIRED — hash-locked closure, a third machine)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone the exact head with plain git (no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          mkdir repo && cd repo && git init -q
          git config core.hooksPath /dev/null
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_B64}"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_B64}" fetch --no-tags --depth 1 origin "${HEAD_SHA}"
          unset AUTH_B64 GH_TOKEN
          git checkout -q --detach "${HEAD_SHA}"
          if grep -riqE 'authorization|x-access-token|bearer|basic [A-Za-z0-9+/=]{16,}' .git/config; then
            echo "FATAL: credential persisted"; exit 1
          fi
      # MÁTRIX 7.2 (eddig nyitva: „a requirements-ci.txt nem pineli önmagát"). A closure hash-eket tartalmaz a
      # CSOMAGOKRA, de a FÁJLT magát semmi nem kötötte: aki a closure-t kicseréli, a hash-eket is átírja, és a
      # `--require-hashes` boldogan telepíti az ÚJ listát. A fájl digestje ezért ITT áll, a workflow-ban —
      # cseréjéhez KÉT egyidejű szerkesztés kell, és mindkettő látszik a PR diffjében.
      # KIMONDVA: ez a workflow-fájl is a HEAD-en él (7.1) — azt repó-beállítás zárja (required status check),
      # nem kód. Ez a lépés a 7.2-t zárja, nem a 7.1-et.
      - name: Pin the closure file itself
        env:
          CLOSURE_SHA256: 7c9b600f71f6c92335dbf4acdfeab694d2a051ebc53e053912bdbe0cff47e510
        run: |
          set -eu
          cd repo
          echo "${CLOSURE_SHA256}  requirements-ci.txt" | sha256sum -c - || {
            echo "FATAL: requirements-ci.txt does not match the digest pinned in this workflow."
            echo "  measured: $(sha256sum requirements-ci.txt | cut -d' ' -f1)"
            echo "  pinned  : ${CLOSURE_SHA256}"
            echo "A closure megváltozott. Ha SZÁNDÉKOS, a workflow CLOSURE_SHA256 értékét is frissíteni kell —"
            echo "épp ez a lényeg: a csere nem történhet EGY fájl szerkesztésével."
            exit 1
          }
      - name: Fail-closed, hash-locked install
        run: |
          set -eux
          cd repo
          python3 -V
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/venv/bin/python -m pip install --require-hashes --no-deps -r requirements-ci.txt
          /tmp/venv/bin/python -c "import cryptography, pytest; print('cryptography', cryptography.__version__)"
      # MIÉRT sudo: az A2 kulcs-registry guardja ROOT-TULAJDONÚ kulcsfájlt és könyvtárat követel (ez maga a
      # biztonsági tulajdonság, nem teszt-kényelem). Egy nem-root futtatónál MINDEN aláírt sor `forged` lesz, és a
      # készlet ~26 tesztje bukik — nem hiba, hanem MÁS környezet. (A Matesensei-oldal nem-root futásainak
      # 19/21/24/26-os bukásszámai pontosan ez az osztály.) A CI ezért úgy futtat, AHOGY A TERMÉK ÜZEMEL: root alatt.
      - name: docs_bind_probe — every "closed" matrix row must name something that exists
        run: |
          set -eu
          cd repo
          /tmp/venv/bin/python docs_bind_probe.py
      - name: sweep_log_probe — every field of EVERY row type (entry AND the signed checkpoint)
        run: |
          set -eu
          cd repo
          sudo /tmp/venv/bin/python sweep_log_probe.py
      - name: Non-root control — how many tests depend on the root-owned key registry
        continue-on-error: true
        run: |
          set -eu
          cd repo
          echo "Ez a lépés SOSEM dönti be a jobot: azt méri, hány teszt bukik NEM-root futtatóval (a kulcs-guard"
          echo "root-tulajdonú registry-t követel) — ez a magyarázat a gépenként eltérő bukásszámokra."
          /tmp/venv/bin/python -m pytest -q ${KNOWN_OPEN} 2>&1 | tail -4 || true
      - name: The suite (ANY failure outside the declared-open probes FAILs the job)
        run: |
          set -eux
          cd repo
          sudo -E env "PATH=$PATH" /tmp/venv/bin/python -m pytest -q ${KNOWN_OPEN}
      - name: The DECLARED-OPEN probes — reported, never hidden, never green-washed
        if: always()
        run: |
          set -eu
          cd repo
          echo "Ezek a szondák SZÁNDÉKOSAN pirosak: kimondott korlátokat dokumentálnak (lásd docs/FEJLESZTES_v1.5.md)."
          sudo -E env "PATH=$PATH" /tmp/venv/bin/python -m pytest -q \
            test_joint_delivery_outcome.py::ClampLiedFields \
            test_joint_audit_anchor_20260916.py::AuditSliceIsUnanchored::test_chain_verify_must_anchor_the_slice_start \
            || echo "(a fenti bukások a deklarált, nyitott tételek — a job zöldjét nem érintik)"
