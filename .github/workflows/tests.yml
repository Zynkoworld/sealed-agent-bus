# AgentBus — the test suite ON A THIRD MACHINE
#
# WHY: every measurement report from the Matesensei side states that "the repo has no CI; every number here is
# measured on OUR machine" — and the same is true for us. This job exists not because the GitHub runner is more
# trustworthy than us, but because it is a THIRD machine: neither party's machine produces the number alone.
#
# PRINCIPLES (modelled on the capsule2-spec sds-conformance.yml):
#   * NO third-party actions (no checkout, no setup-python) — cloning is plain `git`, Python is the
#     runner image's system Python. Less trust surface, nothing to pin to a tag.
#   * Installation is FAIL-CLOSED from a hash-locked closure (`--require-hashes --no-deps`), so a swapped
#     or drifted dependency cannot get in.
#   * The auth header is masked; after the run we check that `.git/config` did NOT retain a secret.
#
# STATED LIMIT: this workflow file lives at HEAD, so a PR can switch it off. That is closed by the repo
# settings (a required status check that also treats a MISSING check as red) — an owner decision,
# not a code question. `requirements-ci.txt` cannot pin itself either.
name: agentbus-tests
on:
  pull_request:
  push:
    branches: [ main, dev/v1.5-notary ]
  workflow_dispatch:
permissions:
  contents: read
env:
  # The DELIBERATELY OPEN probes: not bugs but stated limits. The gate does not hide them —
  # they run in a separate step and their output is in the log; they just do not decide the green.
  KNOWN_OPEN: >-
    --deselect test_joint_delivery_outcome.py::ClampLiedFields::test_lied_next_id_must_not_defeat_the_clamp
    --deselect test_joint_delivery_outcome.py::ClampLiedFields::test_lied_pending_must_not_defeat_the_clamp
    --deselect test_joint_audit_anchor_20260916.py::AuditSliceIsUnanchored::test_chain_verify_must_anchor_the_slice_start
jobs:
  tests:
    name: "tests (REQUIRED — hash-locked closure, a third machine)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone the exact head with plain git (no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          mkdir repo && cd repo && git init -q
          git config core.hooksPath /dev/null
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_B64}"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_B64}" fetch --no-tags --depth 1 origin "${HEAD_SHA}"
          unset AUTH_B64 GH_TOKEN
          git checkout -q --detach "${HEAD_SHA}"
          if grep -riqE 'authorization|x-access-token|bearer|basic [A-Za-z0-9+/=]{16,}' .git/config; then
            echo "FATAL: credential persisted"; exit 1
          fi
      # MATRIX 7.2 (open until now: "requirements-ci.txt does not pin itself"). The closure holds hashes for the
      # PACKAGES, but nothing bound the FILE itself: whoever swaps the closure rewrites the hashes too, and
      # `--require-hashes` happily installs the NEW list. So the file's digest lives HERE, in the workflow —
      # swapping it takes TWO simultaneous edits, and both show in the PR diff.
      # STATED: this workflow file also lives at HEAD (7.1) — that is closed by a repo setting (required status
      # check), not by code. This step closes 7.2, not 7.1.
      - name: Pin the closure file itself
        env:
          CLOSURE_SHA256: af7654eabe8c4c630cc8bdbbf7240d42f778affb9d88fd32498ef4d7b5439bbe
        run: |
          set -eu
          cd repo
          echo "${CLOSURE_SHA256}  requirements-ci.txt" | sha256sum -c - || {
            echo "FATAL: requirements-ci.txt does not match the digest pinned in this workflow."
            echo "  measured: $(sha256sum requirements-ci.txt | cut -d' ' -f1)"
            echo "  pinned  : ${CLOSURE_SHA256}"
            echo "The closure changed. If this is INTENTIONAL, the workflow's CLOSURE_SHA256 must be updated too —"
            echo "that is the whole point: the swap cannot happen by editing ONE file."
            exit 1
          }
      - name: Fail-closed, hash-locked install
        run: |
          set -eux
          cd repo
          python3 -V
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/venv/bin/python -m pip install --require-hashes --no-deps -r requirements-ci.txt
          /tmp/venv/bin/python -c "import cryptography, pytest; print('cryptography', cryptography.__version__)"
      # WHY sudo: the A2 key-registry guard requires a ROOT-OWNED key file and directory (that is the security
      # property itself, not a test convenience). Under a non-root runner EVERY signed row becomes `forged`, and
      # ~26 tests of the suite fail — not a bug but a DIFFERENT environment. (The 19/21/24/26 failure counts of the
      # Matesensei side's non-root runs are exactly this class.) So CI runs the way THE PRODUCT OPERATES: as root.
      - name: docs_bind_probe — every "closed" matrix row must name something that exists
        run: |
          set -eu
          cd repo
          /tmp/venv/bin/python docs_bind_probe.py
      - name: sweep_log_probe — every field of EVERY row type (entry AND the signed checkpoint)
        run: |
          set -eu
          cd repo
          sudo /tmp/venv/bin/python sweep_log_probe.py
      - name: Non-root control — how many tests depend on the root-owned key registry
        continue-on-error: true
        run: |
          set -eu
          cd repo
          echo "This step NEVER fails the job: it measures how many tests fail under a NON-root runner (the key guard"
          echo "requires a root-owned registry) — this explains the differing failure counts per machine."
          /tmp/venv/bin/python -m pytest -q ${KNOWN_OPEN} 2>&1 | tail -4 || true
      - name: The suite (ANY failure outside the declared-open probes FAILs the job)
        run: |
          set -eux
          cd repo
          sudo -E env "PATH=$PATH" /tmp/venv/bin/python -m pytest -q ${KNOWN_OPEN}
      - name: The DECLARED-OPEN probes — reported, never hidden, never green-washed
        if: always()
        run: |
          set -eu
          cd repo
          echo "These probes are DELIBERATELY red: they document stated limits (see docs/internal-hu/FEJLESZTES_v1.5.md)."
          sudo -E env "PATH=$PATH" /tmp/venv/bin/python -m pytest -q \
            test_joint_delivery_outcome.py::ClampLiedFields \
            test_joint_audit_anchor_20260916.py::AuditSliceIsUnanchored::test_chain_verify_must_anchor_the_slice_start \
            || echo "(the failures above are the declared open items — they do not affect the job's green)"
